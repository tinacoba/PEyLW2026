<html>
<head>
<title>Ejercicio13.html</title>
</head>

<body>
    <h1>Inmobiliaria UNC</h1>
    <form>
        Nombre:
<input type="text" name="nombre" maxlength="25">

<br><br>

Apellido:
<input type="text" name="apellido" maxlength="25">

<br><br>

Direccion:

<br>

<textarea name="direccion" rows="4" cols="30">
</textarea>

<br><br>

Telefono:
<input type="text" name="telefono" maxlength="15" value="0299-">

<br><br>

Operacion:

<br>

<input type="radio" name="operacion" value="alquiler">
Alquiler

<br>

<input type="radio" name="operacion" value="compra" checked>
Compra

<br><br>

Zona:

<br>

<input type="checkbox" name="centro" checked>
Zona Centro

<br>

<input type="checkbox" name="norte">
Zona Norte

<br>

<input type="checkbox" name="sur" checked>
Zona Sur

<br><br>

Comentario del inmueble que busca:

<br>

<textarea name="comentario" rows="5" cols="40">
</textarea>

<br><br>

<input type="reset" value="Borrar">

<input type="submit" value="Enviar">

</form>

</body>

</html>
